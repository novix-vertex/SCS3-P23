<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sheryians Coding School | Learn Coding in India</title>
    <link rel="shortcut icon" href="assets/images/favicon.webp" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="dots dots-left"></div>
        <div class="dots dots-right"></div>
        <header>
            <img class="logo" src="assets/images/logo.webp" alt="Sheryians logo">
            <nav>
                <menu>
                    <ul>
                        <li class="menu"><a href="#">Home</a></li>
                        <li class="menu"><a href="#">Courses</a></li>
                        <li class="menu"><a href="#">Bootcamp</a></li>
                        <li class="menu"><a href="#">Classroom</a></li>
                        <li class="menu"><a href="#">Request Callback</a></li>
                    </ul>
                </menu>
            </nav>
            <div class="profile">
                <img src="assets/images/profile.png" alt="profile image">
                <i class="ri-arrow-down-s-line"></i>
            </div>
        </header>
        <section class="hero">
            <div class="dots dots-left"></div>
            <div class="dots dots-right"></div>

            <div class="content">

                <h4>Learn. Build. Get Placed.</h4>
                <h1>Become the Software Engineer<br />that
                    <span>
                        <span class="box">
                            <div class="border-dot top-left-dot"></div>
                            <div class="border-dot top-right-dot"></div>
                            <div class="border-dot bottom-left-dot"></div>
                            <div class="border-dot bottom-right-dot"></div>
                        </span>
                        <span class="companies-lbl">
                            Companies</span>
                    </span>
                    Want to Hire!
                </h1>
                <p>Join a growing community of students preparing for real-world tech careers at<br />Sheryians.</p>
                <div class="views">
                    <div class="avtar-row">
                        <img class="student-img" src="assets/images/st1.jpg" alt="student">
                        <img class="student-img" src="assets/images/st2.jpg" alt="student">
                        <img class="student-img" src="assets/images/st3.jpg" alt="student">
                        <img class="student-img" src="assets/images/st4.jpg" alt="student">
                    </div>
                    <span class="st-count">1 Million+</span>
                    <span class="other-p">Students learning in our mastery programs</span>
                </div>
                <button class="start-journey">Start Journey <i class="ri-arrow-right-long-line"></i></button>
            </div>
        </section>
    </main>

</body>

</html>
